
name: Deploy Hello World - Producao

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Aguardar aprovacao e atualizar EC2 Producao
    runs-on: ubuntu-latest

    # Exige aprovação no ambiente producao
    environment:
      name: producao

    steps:
      - name: Configurar credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCAO }}
          aws-region: us-east-2

      - name: Enviar comando de deploy via SSM
        env:
          INSTANCE_ID: i-0f2a1643404838748
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo -u ubuntu git -C /opt/marcelo-hello-world fetch origin && sudo -u ubuntu git -C /opt/marcelo-hello-world reset --hard origin/main && sudo systemctl restart marcelo-hello-world && sudo systemctl is-active --quiet marcelo-hello-world"]' \
            --query "Command.CommandId" \
            --output text)

          echo "Comando enviado: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Status do deploy: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --output json
              exit 1
            fi

            sleep 5
          done

          echo "ERRO: tempo limite aguardando resposta do SSM."
          exit 1
