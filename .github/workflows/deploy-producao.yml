
name: Deploy Hello World - Producao

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  notify:
    name: Enviar aviso de aprovacao por email
    runs-on: ubuntu-latest

    steps:
      - name: Enviar notificacao via SendGrid
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_TO: prmarcelo.veronez@gmail.com
          EMAIL_FROM: veronez@policiamilitar.sp.gov.br
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          subject = "Aprovacao pendente - Deploy em Producao AWS"

          body = f"""
          Ola!

          Existe uma nova implantacao aguardando sua aprovacao.

          Repositorio: {os.environ['REPOSITORY']}
          Commit: {os.environ['COMMIT']}

          Acesse o GitHub Actions para revisar e aprovar:
          {os.environ['RUN_URL']}

          A producao somente sera atualizada depois da sua aprovacao.
          """

          payload = {
              "personalizations": [{
                  "to": [{"email": os.environ["EMAIL_TO"]}]
              }],
              "from": {"email": os.environ["EMAIL_FROM"]},
              "subject": subject,
              "content": [{
                  "type": "text/plain",
                  "value": body
              }]
          }

          request = urllib.request.Request(
              "https://api.sendgrid.com/v3/mail/send",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + os.environ["SENDGRID_API_KEY"],
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              print("SendGrid HTTP:", response.status)
              if response.status != 202:
                  raise RuntimeError("Envio de email nao confirmado")
          PY

  deploy:
    name: Aguardar aprovacao e atualizar EC2 Producao
    runs-on: ubuntu-latest
    needs: notify

    environment:
      name: producao

    steps:
      - name: Configurar credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCAO }}
          aws-region: us-east-2

      - name: Enviar comando de deploy via SSM
        env:
          INSTANCE_ID: i-0f2a1643404838748
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo -u ubuntu git -C /opt/marcelo-hello-world fetch origin && sudo -u ubuntu git -C /opt/marcelo-hello-world reset --hard origin/main && sudo systemctl restart marcelo-hello-world && sudo systemctl is-active --quiet marcelo-hello-world"]' \
            --query "Command.CommandId" \
            --output text)

          echo "Comando enviado: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Status do deploy: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --output json
              exit 1
            fi

            sleep 5
          done

          echo "ERRO: tempo limite aguardando resposta do SSM."
          exit 1
